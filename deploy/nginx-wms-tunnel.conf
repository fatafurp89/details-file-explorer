# سيرفر WMS (194.248 / 10.9.0.4): /etc/nginx/sites-enabled/explorer.details-wms.cloud.tunnel
# يُستقبل فقط من الجسر عبر WireGuard (10.9.0.1 -> 10.9.0.4:3680). يضيف ترويسة X-Gw-Proxy اللي
# التطبيق يشترطها (GW_TRUSTED=1) قبل الوثوق بترويسات الهوية X-Gw-* القادمة من الجسر.
server {
    listen 10.9.0.4:3680;
    server_name explorer.details-wms.cloud;
    client_max_body_size 2g;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Gw-Proxy "1";
        # X-Gw-Employee-No / X-Gw-Name / X-Gw-Email / X-Gw-Role / X-Gw-Level تمر كما هي من الجسر
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}

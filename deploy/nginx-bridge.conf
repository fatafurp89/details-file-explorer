# Bridge (179.198.192.141): /etc/nginx/sites-available/explorer.details-wms.cloud
# كل الطلبات تمر عبر بوابة ديتيلز (auth_request) — لا مسارات عامة هنا (لا يوجد رفع/مشاركة عامة بعد).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name explorer.details-wms.cloud;
    ssl_certificate     /etc/letsencrypt/live/apps.details-wms.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.details-wms.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    server_tokens off;
    client_max_body_size 2g;
    proxy_request_buffering off;

    auth_request /_gw/verify;
    auth_request_set $gw_id    $upstream_http_x_gw_employee_id;
    auth_request_set $gw_no    $upstream_http_x_gw_employee_no;
    auth_request_set $gw_name  $upstream_http_x_gw_name;
    auth_request_set $gw_email $upstream_http_x_gw_email;
    auth_request_set $gw_role  $upstream_http_x_gw_role;
    auth_request_set $gw_level $upstream_http_x_gw_level;
    error_page 401 = @login;
    error_page 403 = @denied;

    location = /_gw/verify {
        internal;
        proxy_pass http://127.0.0.1:4000/_gw/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host details-wms.cloud;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Gw-System storage;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @login  { return 302 https://details-wms.cloud/login?next=$scheme://$host$request_uri; }
    location @denied { return 302 https://details-wms.cloud/denied?s=storage; }

    location / {
        proxy_pass http://10.9.0.4:3680;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Gw-Employee-Id $gw_id;
        proxy_set_header X-Gw-Employee-No $gw_no;
        proxy_set_header X-Gw-Name  $gw_name;
        proxy_set_header X-Gw-Email $gw_email;
        proxy_set_header X-Gw-Role  $gw_role;
        proxy_set_header X-Gw-Level $gw_level;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
